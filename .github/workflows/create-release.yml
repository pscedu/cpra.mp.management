name: Create release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}
    steps:
      - name: Release please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          release-type: python

  build-image:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Prepare image
        id: prepare
        run: |
          VERSION=$(echo "${{ needs.release.outputs.tag_name }}" | sed -e 's|^v||')
          echo "image_tag=ghcr.io/${{ github.repository }}:$VERSION" >> $GITHUB_OUTPUT
      - name: Build image
        run: |
          docker build . --tag "${{ steps.prepare.outputs.image_tag }}" --label "runnumber=${GITHUB_RUN_ID}"
      - name: Log in to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push image
        run: |
          docker push "${{ steps.prepare.outputs.image_tag }}"
